name: A0 Reference Contract (NOT real EDA)
on:
  push:
    branches: [main]
  pull_request:
jobs:
  a0-stdlib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local package
        run: python -m pip install --no-build-isolation -e .
      - name: Run A0 local reference tests
        run: python -m unittest discover -s tests -v
      - name: Record limitation
        run: echo 'A0 local kernel only. No real Codex/Claude/EDA verification in this job.'
